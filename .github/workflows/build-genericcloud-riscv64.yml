name: Build AlmaLinux Kitten GenericCloud (RISC-V)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64

      - name: Start RISC-V build container
        run: |
          sudo modprobe loop max_part=16
          docker run -d \
            --platform=linux/riscv64 \
            --name riscv64-build \
            --privileged \
            -v /dev:/dev \
            -v ${{ github.workspace }}:/kiwi-descriptions:Z \
            quay.io/almalinuxorg/10-kitten-riscv64-development \
            sleep infinity

      - name: Install kiwi-cli
        run: |
          docker exec riscv64-build \
            dnf install -y kiwi-cli distribution-gpg-keys

      - name: Build GenericCloud image
        run: |
          docker exec riscv64-build \
            kiwi-ng --debug --type=oem --profile=Cloud-Base-Generic \
              --kiwi-file=AlmaLinux-OS-Kitten-P550.kiwi \
              system build \
              --description /kiwi-descriptions \
              --target-dir /var/tmp/build

      - name: Extract and rename artifacts
        run: |
          BUILD_DATE=$(date +%Y%m%d)
          IMAGE_NAME="AlmaLinux-Kitten-GenericCloud-10-${BUILD_DATE}.0.riscv64"
          echo "IMAGE_NAME=${IMAGE_NAME}" >> "$GITHUB_ENV"
          mkdir -p output
          docker cp riscv64-build:/var/tmp/build/AlmaLinux-Kitten-P550.riscv64-10.qcow2 "output/${IMAGE_NAME}.qcow2"
          docker cp riscv64-build:/var/tmp/build/AlmaLinux-Kitten-P550.riscv64-10.packages "output/${IMAGE_NAME}.packages"
          docker cp riscv64-build:/var/tmp/build/AlmaLinux-Kitten-P550.riscv64-10.verified "output/${IMAGE_NAME}.verified"
          docker cp riscv64-build:/var/tmp/build/AlmaLinux-Kitten-P550.riscv64-10.changes "output/${IMAGE_NAME}.changes"

      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}.qcow2
          path: output/${{ env.IMAGE_NAME }}.qcow2
          compression-level: 0

      - name: Upload packages list
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}.packages
          path: output/${{ env.IMAGE_NAME }}.packages

      - name: Upload verified log
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}.verified
          path: output/${{ env.IMAGE_NAME }}.verified

      - name: Upload changes log
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}.changes
          path: output/${{ env.IMAGE_NAME }}.changes
