name: Build AlmaLinux Kitten GenericCloud

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Architecture to build (all = build all in parallel)'
        required: true
        type: choice
        default: all
        options:
          - all
          - x86_64
          - x86_64_v2
          - aarch64
          - ppc64le
          - riscv64
          - s390x

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      arches: ${{ steps.set.outputs.arches }}
    steps:
      - id: set
        run: |
          if [ "${{ inputs.arch }}" = "all" ]; then
            echo 'arches=["x86_64","x86_64_v2","aarch64","ppc64le","riscv64","s390x"]' >> "$GITHUB_OUTPUT"
          else
            echo 'arches=["${{ inputs.arch }}"]' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.matrix.outputs.arches) }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set build variables
        id: vars
        run: |
          ARCH="${{ matrix.arch }}"
          case "$ARCH" in
            x86_64)
              DOCKER_PLATFORM="linux/amd64"
              QEMU_PLATFORM=""
              KIWI_ARCH="x86_64"
              ;;
            x86_64_v2)
              DOCKER_PLATFORM="linux/amd64"
              QEMU_PLATFORM=""
              KIWI_ARCH="x86_64"
              ;;
            aarch64)
              DOCKER_PLATFORM="linux/arm64"
              QEMU_PLATFORM=""
              KIWI_ARCH="aarch64"
              ;;
            ppc64le)
              DOCKER_PLATFORM="linux/ppc64le"
              QEMU_PLATFORM="ppc64le"
              KIWI_ARCH="ppc64le"
              ;;
            riscv64)
              DOCKER_PLATFORM="linux/riscv64"
              QEMU_PLATFORM="riscv64"
              KIWI_ARCH="riscv64"
              ;;
            s390x)
              DOCKER_PLATFORM="linux/s390x"
              QEMU_PLATFORM="s390x"
              KIWI_ARCH="s390x"
              ;;
          esac
          echo "docker_platform=${DOCKER_PLATFORM}" >> "$GITHUB_OUTPUT"
          echo "qemu_platform=${QEMU_PLATFORM}" >> "$GITHUB_OUTPUT"
          echo "kiwi_arch=${KIWI_ARCH}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: steps.vars.outputs.qemu_platform != ''
        uses: docker/setup-qemu-action@v3
        with:
          platforms: ${{ steps.vars.outputs.qemu_platform }}

      - name: Start build container
        run: |
          sudo modprobe loop max_part=16
          docker run -d \
            --platform=${{ steps.vars.outputs.docker_platform }} \
            --name build \
            --privileged \
            -v /dev:/dev \
            -v ${{ github.workspace }}:/kiwi-descriptions:Z \
            almalinux:10-kitten \
            sleep infinity

      - name: Install kiwi-cli
        run: |
          if [ "${{ matrix.arch }}" = "riscv64" ]; then
            docker exec build \
              dnf install -y almalinux-kitten-release-devel
          else
            docker exec build \
              dnf install -y epel-release
          fi
          docker exec build \
            dnf install -y kiwi-cli distribution-gpg-keys

      - name: Patch repositories for x86_64_v2
        if: matrix.arch == 'x86_64_v2'
        run: |
          cd ${{ github.workspace }}
          sed -i 's|\(mirrorlist/\$releasever-kitten/[^"?]*\)"|\1?arch=x86_64_v2"|g' repositories/core.xml
          sed -i \
            's|sourcetype="metalink" arch="x86_64,aarch64,ppc64le,s390x">|arch="x86_64">|;
             s|https://mirrors.fedoraproject.org/metalink?repo=epel-\$releasever\&amp;arch=\$basearch|https://epel.repo.almalinux.org/$releasever/x86_64_v2/|;
             /signing key.*epel/d' repositories/epel.xml

      - name: Build GenericCloud image
        run: |
          docker exec build \
            kiwi-ng --debug --type=oem --profile=Cloud-Base-Generic \
              --kiwi-file=AlmaLinux-OS-Kitten.kiwi \
              system build \
              --description /kiwi-descriptions \
              --target-dir /var/tmp/build

      - name: Extract and rename artifacts
        run: |
          ARCH="${{ matrix.arch }}"
          KIWI_ARCH="${{ steps.vars.outputs.kiwi_arch }}"
          BUILD_DATE=$(date +%Y%m%d)
          IMAGE_NAME="AlmaLinux-Kitten-GenericCloud-10-${BUILD_DATE}.0.${ARCH}"
          echo "IMAGE_NAME=${IMAGE_NAME}" >> "$GITHUB_ENV"
          mkdir -p output
          docker cp "build:/var/tmp/build/AlmaLinux-Kitten.${KIWI_ARCH}-10.qcow2" "output/${IMAGE_NAME}.qcow2"
          docker cp "build:/var/tmp/build/AlmaLinux-Kitten.${KIWI_ARCH}-10.packages" "output/${IMAGE_NAME}.packages"
          cut -d'|' -f1 "output/${IMAGE_NAME}.packages" | sort > "output/${IMAGE_NAME}.qcow2.txt"
          rm -f "output/${IMAGE_NAME}.packages"
          sha256sum "output/${IMAGE_NAME}.qcow2" | sed 's|output/||' > "output/${IMAGE_NAME}.qcow2.sha256sum"

      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}.qcow2
          path: output/${{ env.IMAGE_NAME }}.qcow2
          compression-level: 0

      - name: Upload SHA256 checksum
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}.qcow2.sha256sum
          path: output/${{ env.IMAGE_NAME }}.qcow2.sha256sum

      - name: Upload packages list
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}.qcow2.txt
          path: output/${{ env.IMAGE_NAME }}.qcow2.txt
