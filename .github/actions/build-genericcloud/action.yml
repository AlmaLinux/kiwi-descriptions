name: Build GenericCloud Image
description: Build an AlmaLinux GenericCloud image using Kiwi

inputs:
  arch:
    description: Target architecture
    required: true
  docker-image:
    description: Docker image to use as build container
    required: true
  kiwi-file:
    description: Kiwi description file name
    required: true
  kiwi-name:
    description: Kiwi output file prefix (e.g. AlmaLinux-Kitten)
    required: true
  image-name-prefix:
    description: Artifact name prefix (e.g. AlmaLinux-Kitten-GenericCloud)
    required: true
  version:
    description: Major version (e.g. 8, 9, 10)
    required: true
  detect-minor-version:
    description: Auto-detect minor version from almalinux-release RPM
    required: false
    default: 'true'
  x86_64_v2-repo-sed:
    description: sed command to patch core repo XML for x86_64_v2
    required: true

runs:
  using: composite
  steps:
    - name: Set build variables
      id: vars
      shell: bash
      run: |
        ARCH="${{ inputs.arch }}"
        case "$ARCH" in
          x86_64)
            DOCKER_PLATFORM="linux/amd64"
            QEMU_PLATFORM=""
            KIWI_ARCH="x86_64"
            ;;
          x86_64_v2)
            DOCKER_PLATFORM="linux/amd64"
            QEMU_PLATFORM=""
            KIWI_ARCH="x86_64"
            ;;
          aarch64)
            DOCKER_PLATFORM="linux/arm64"
            QEMU_PLATFORM=""
            KIWI_ARCH="aarch64"
            ;;
          ppc64le)
            DOCKER_PLATFORM="linux/ppc64le"
            QEMU_PLATFORM="ppc64le"
            KIWI_ARCH="ppc64le"
            ;;
          riscv64)
            DOCKER_PLATFORM="linux/riscv64"
            QEMU_PLATFORM="riscv64"
            KIWI_ARCH="riscv64"
            ;;
          s390x)
            DOCKER_PLATFORM="linux/s390x"
            QEMU_PLATFORM="s390x"
            KIWI_ARCH="s390x"
            ;;
        esac
        echo "docker_platform=${DOCKER_PLATFORM}" >> "$GITHUB_OUTPUT"
        echo "qemu_platform=${QEMU_PLATFORM}" >> "$GITHUB_OUTPUT"
        echo "kiwi_arch=${KIWI_ARCH}" >> "$GITHUB_OUTPUT"

    - name: Set up QEMU
      if: steps.vars.outputs.qemu_platform != ''
      uses: docker/setup-qemu-action@v4
      with:
        platforms: ${{ steps.vars.outputs.qemu_platform }}

    - name: Start build container
      shell: bash
      run: |
        sudo modprobe loop max_part=16
        docker run -d \
          --platform=${{ steps.vars.outputs.docker_platform }} \
          --name build \
          --privileged \
          -v /dev:/dev \
          -v ${{ github.workspace }}:/kiwi-descriptions:Z \
          ${{ inputs.docker-image }} \
          sleep infinity

    - name: Install kiwi-cli
      shell: bash
      run: |
        if [ "${{ inputs.arch }}" = "riscv64" ]; then
          docker exec build \
            dnf install -y almalinux-kitten-release-devel
          docker exec build \
            dnf install -y kiwi-cli distribution-gpg-keys \
              kiwi-systemdeps-bootloaders kiwi-systemdeps-containers \
              kiwi-systemdeps-core \
              kiwi-systemdeps-filesystems kiwi-systemdeps-iso-media \
              gdisk lvm2 parted kpartx cryptsetup mdadm util-linux
        else
          docker exec build \
            dnf install -y epel-release
          if [ "${{ inputs.version }}" = "8" ]; then
            docker exec build \
              dnf install -y dnf-plugins-core
            docker exec build \
              dnf config-manager --add-repo \
                "https://build.almalinux.org/pulp/content/copr/andrewlukoshko-kiwi-almalinux-8-${{ steps.vars.outputs.kiwi_arch }}-dr/"
          fi
          docker exec build \
            dnf install -y kiwi-cli distribution-gpg-keys
        fi

    - name: Detect release version
      id: release
      shell: bash
      run: |
        if [ "${{ inputs.detect-minor-version }}" = "true" ]; then
          VERSION=$(rpm -qp --qf '%{VERSION}' "https://repo.almalinux.org/almalinux/almalinux-release-latest-${{ inputs.version }}.${{ inputs.arch }}.rpm")
        else
          VERSION="${{ inputs.version }}"
        fi
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

    - name: Patch repositories for x86_64_v2
      if: inputs.arch == 'x86_64_v2'
      shell: bash
      run: |
        cd ${{ github.workspace }}
        ${{ inputs.x86_64_v2-repo-sed }}
        sed -i \
          's|sourcetype="metalink" arch="x86_64,aarch64,ppc64le,s390x">|arch="x86_64">|;
           s|https://mirrors.fedoraproject.org/metalink?repo=epel-\$releasever\&amp;arch=\$basearch|https://epel.repo.almalinux.org/$releasever/x86_64_v2/|;
           /signing key.*epel/d' repositories/epel.xml

    - name: Build GenericCloud image
      shell: bash
      run: |
        docker exec build \
          kiwi-ng --debug --type=oem --profile=Cloud-Base-Generic \
            --kiwi-file=${{ inputs.kiwi-file }} \
            system build \
            --description /kiwi-descriptions \
            --target-dir /var/tmp/build

    - name: Extract and rename artifacts
      shell: bash
      run: |
        ARCH="${{ inputs.arch }}"
        KIWI_ARCH="${{ steps.vars.outputs.kiwi_arch }}"
        BUILD_DATE=$(date +%Y%m%d)
        IMAGE_NAME="${{ inputs.image-name-prefix }}-${{ steps.release.outputs.version }}-${BUILD_DATE}.0.${ARCH}"
        echo "IMAGE_NAME=${IMAGE_NAME}" >> "$GITHUB_ENV"
        mkdir -p output
        docker cp "build:/var/tmp/build/${{ inputs.kiwi-name }}.${KIWI_ARCH}-${{ inputs.version }}.qcow2" "output/${IMAGE_NAME}.qcow2"
        docker cp "build:/var/tmp/build/${{ inputs.kiwi-name }}.${KIWI_ARCH}-${{ inputs.version }}.packages" "output/${IMAGE_NAME}.packages"
        cut -d'|' -f1 "output/${IMAGE_NAME}.packages" | sort > "output/${IMAGE_NAME}.qcow2.txt"
        rm -f "output/${IMAGE_NAME}.packages"
        sha256sum "output/${IMAGE_NAME}.qcow2" | sed 's|output/||' > "output/${IMAGE_NAME}.qcow2.sha256sum"

    - name: Upload disk image
      uses: actions/upload-artifact@v6
      with:
        name: ${{ env.IMAGE_NAME }}.qcow2
        path: output/${{ env.IMAGE_NAME }}.qcow2
        compression-level: 0

    - name: Upload SHA256 checksum
      uses: actions/upload-artifact@v6
      with:
        name: ${{ env.IMAGE_NAME }}.qcow2.sha256sum
        path: output/${{ env.IMAGE_NAME }}.qcow2.sha256sum

    - name: Upload packages list
      uses: actions/upload-artifact@v6
      with:
        name: ${{ env.IMAGE_NAME }}.qcow2.txt
        path: output/${{ env.IMAGE_NAME }}.qcow2.txt

    - name: Fix /dev/kvm permissions
      shell: bash
      run: |
        [ -e /dev/kvm ] && sudo chmod 666 /dev/kvm || true

    - name: Boot test
      shell: bash
      run: |
        KVM_DEVICE=""
        [ -e /dev/kvm ] && KVM_DEVICE="--device /dev/kvm"

        cat <<'BOOTSCRIPT' > /tmp/boot-test.sh
        #!/bin/bash
        set -euo pipefail

        apt-get update -q >/dev/null 2>&1
        case "$ARCH" in
          x86_64|x86_64_v2)
            apt-get install -y -q qemu-system-x86 ovmf expect genisoimage >/dev/null 2>&1 ;;
          aarch64)
            apt-get install -y -q qemu-system-arm qemu-efi-aarch64 expect genisoimage >/dev/null 2>&1 ;;
          ppc64le)
            apt-get install -y -q qemu-system-ppc expect genisoimage >/dev/null 2>&1 ;;
          s390x)
            apt-get install -y -q qemu-system-s390x expect genisoimage >/dev/null 2>&1 ;;
          riscv64)
            apt-get install -y -q qemu-system-misc qemu-efi-riscv64 expect genisoimage >/dev/null 2>&1 ;;
        esac

        HOST_ARCH=$(uname -m)
        case "$ARCH" in
          x86_64|x86_64_v2) GUEST_ARCH="x86_64" ;;
          *) GUEST_ARCH="$ARCH" ;;
        esac

        if [ -e /dev/kvm ] && [ "$HOST_ARCH" = "$GUEST_ARCH" ]; then
          KVM_OPTS="-enable-kvm -cpu host"
        elif [ "$ARCH" = "aarch64" ]; then
          echo "NOTE: Using TCG with cortex-a57 for aarch64"
          KVM_OPTS="-accel tcg -cpu cortex-a57"
        elif [ "$ARCH" = "ppc64le" ]; then
          echo "NOTE: Using TCG for ppc64le"
          KVM_OPTS="-accel tcg"
        elif [ "$ARCH" = "riscv64" ]; then
          echo "NOTE: Using TCG for riscv64"
          KVM_OPTS="-accel tcg,tb-size=1024"
        else
          echo "NOTE: Using TCG emulation (slow)"
          KVM_OPTS="-accel tcg -cpu max"
        fi

        TEST_DIR=$(mktemp -d)

        cat > "$TEST_DIR/meta-data" <<METAEOF
        instance-id: test
        local-hostname: test
        METAEOF

        cat > "$TEST_DIR/user-data" <<USEREOF
        #cloud-config
        password: almalinux
        chpasswd:
          expire: false
        ssh_pwauth: true
        USEREOF

        genisoimage -output "$TEST_DIR/cidata.iso" -volid cidata -joliet -rock \
          "$TEST_DIR/user-data" "$TEST_DIR/meta-data" 2>/dev/null

        SECUREBOOT=0
        FIRMWARE_OPTS=""
        QEMU_EXTRA=""
        QEMU_MEM=2048

        case "$ARCH" in
          x86_64|x86_64_v2)
            QEMU_BIN="qemu-system-x86_64"
            if [ -e /dev/kvm ] && [ "$HOST_ARCH" = "x86_64" ]; then
              QEMU_MACHINE="-machine q35,smm=on"
              QEMU_EXTRA="-global driver=cfi.pflash01,property=secure,value=on"
              cp /usr/share/OVMF/OVMF_VARS_4M.ms.fd "$TEST_DIR/efivars.fd"
              FIRMWARE_OPTS="-drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.secboot.fd -drive if=pflash,format=raw,file=$TEST_DIR/efivars.fd"
              SECUREBOOT=1
            else
              cp /usr/share/OVMF/OVMF_VARS_4M.fd "$TEST_DIR/efivars.fd"
              FIRMWARE_OPTS="-drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.fd -drive if=pflash,format=raw,file=$TEST_DIR/efivars.fd"
            fi
            ;;
          aarch64)
            QEMU_BIN="qemu-system-aarch64"
            if [ -e /dev/kvm ] && [ "$HOST_ARCH" = "aarch64" ]; then
              QEMU_MACHINE="-M virt,secure=on"
              cp /usr/share/AAVMF/AAVMF_VARS.ms.fd "$TEST_DIR/efivars.fd"
              FIRMWARE_OPTS="-drive if=pflash,format=raw,readonly=on,file=/usr/share/AAVMF/AAVMF_CODE.secboot.fd -drive if=pflash,format=raw,file=$TEST_DIR/efivars.fd"
              SECUREBOOT=1
            else
              QEMU_MACHINE="-M virt"
              cp /usr/share/AAVMF/AAVMF_VARS.fd "$TEST_DIR/efivars.fd"
              FIRMWARE_OPTS="-drive if=pflash,format=raw,readonly=on,file=/usr/share/AAVMF/AAVMF_CODE.fd -drive if=pflash,format=raw,file=$TEST_DIR/efivars.fd"
            fi
            ;;
          ppc64le)
            QEMU_BIN="qemu-system-ppc64"
            QEMU_MACHINE="-M pseries"
            ;;
          s390x)
            QEMU_BIN="qemu-system-s390x"
            QEMU_MACHINE="-M s390-ccw-virtio"
            ;;
          riscv64)
            QEMU_BIN="qemu-system-riscv64"
            QEMU_MACHINE="-M virt"
            QEMU_EXTRA="-device virtio-rng-pci"
            cp /usr/share/qemu-efi-riscv64/RISCV_VIRT_VARS.fd "$TEST_DIR/efivars.fd"
            FIRMWARE_OPTS="-drive if=pflash,format=raw,readonly=on,file=/usr/share/qemu-efi-riscv64/RISCV_VIRT_CODE.fd -drive if=pflash,format=raw,file=$TEST_DIR/efivars.fd"
            ;;
        esac

        cp /output/$IMAGE_NAME.qcow2 "$TEST_DIR/disk.qcow2"

        cat > "$TEST_DIR/run-qemu.sh" <<QEMUEOF
        #!/bin/bash
        exec $QEMU_BIN $KVM_OPTS $QEMU_MACHINE -smp 2 -m $QEMU_MEM -nographic \
          $QEMU_EXTRA \
          $FIRMWARE_OPTS \
          -drive file=$TEST_DIR/disk.qcow2,format=qcow2,if=virtio \
          -drive file=$TEST_DIR/cidata.iso,format=raw,if=virtio
        QEMUEOF
        chmod +x "$TEST_DIR/run-qemu.sh"

        if [ -e /dev/kvm ] && [ "$HOST_ARCH" = "$GUEST_ARCH" ]; then
          EXPECT_TIMEOUT=300
        else
          EXPECT_TIMEOUT=1800
        fi

        EXP_SECUREBOOT=""
        if [ "$SECUREBOOT" = "1" ]; then
          EXP_SECUREBOOT='
        send "mokutil --sb-state\r"
        expect {
            "SecureBoot enabled" { puts "PASS: SecureBoot enabled" }
            timeout { puts "FAIL: SecureBoot not enabled"; exit 1 }
        }
        expect "\\\$ "'
        fi

        EXP_BOOTLOADER_INFO=""
        if [ "$ARCH" = "s390x" ]; then
          EXP_BOOTLOADER_INFO='
        send "echo === /etc/zipl.conf === && sudo cat /etc/zipl.conf\r"
        expect "\\\$ "
        send "echo === /etc/zipl.d/ === && sudo ls -la /etc/zipl.d/ 2>/dev/null; sudo cat /etc/zipl.d/*.conf 2>/dev/null; echo === end zipl.d ===\r"
        expect "\\\$ "
        send "echo === BLS entries === && sudo ls -la /boot/loader/entries/ && sudo cat /boot/loader/entries/*.conf\r"
        expect "\\\$ "'
        else
          EXP_BOOTLOADER_INFO='
        send "echo === /etc/default/grub === && sudo cat /etc/default/grub\r"
        expect "\\\$ "
        send "echo === /boot/grub2/grub.cfg === && sudo cat /boot/grub2/grub.cfg\r"
        expect "\\\$ "
        send "echo === /boot/grub2/grubenv === && sudo cat /boot/grub2/grubenv\r"
        expect "\\\$ "
        send "echo === BLS entries === && sudo ls -la /boot/loader/entries/ && sudo cat /boot/loader/entries/*.conf\r"
        expect "\\\$ "'
        fi

        cat > "$TEST_DIR/boot-test.exp" <<EXPEOF
        log_user 1
        set timeout $EXPECT_TIMEOUT

        spawn [lindex \$argv 0]

        expect {
            "login:" {}
            timeout { puts "FAIL: No login prompt"; exit 1 }
        }
        send "almalinux\r"

        expect {
            "Password:" {}
            timeout { puts "FAIL: No password prompt"; exit 1 }
        }
        send "almalinux\r"

        expect {
            "\\\$ " {}
            timeout { puts "FAIL: No shell prompt"; exit 1 }
        }

        send "cat /etc/os-release\r"
        expect {
            "AlmaLinux" { puts "PASS: os-release" }
            timeout { puts "FAIL: os-release check"; exit 1 }
        }
        expect "\\\$ "

        send "cloud-init status --wait\r"
        expect {
            "done" { puts "PASS: cloud-init" }
            timeout { puts "FAIL: cloud-init not done"; exit 1 }
        }
        expect "\\\$ "

        send "tuned-adm active\r"
        expect {
            "virtual-guest" { puts "PASS: tuned profile" }
            timeout { puts "FAIL: tuned profile"; exit 1 }
        }
        expect "\\\$ "
        $EXP_SECUREBOOT
        $EXP_BOOTLOADER_INFO

        send "sudo poweroff\r"
        expect eof

        puts "\nAll boot tests passed!"
        exit 0
        EXPEOF

        expect "$TEST_DIR/boot-test.exp" "$TEST_DIR/run-qemu.sh"
        rm -rf "$TEST_DIR"
        BOOTSCRIPT

        docker run --rm \
          -v "$PWD/output:/output:ro" \
          -v /tmp/boot-test.sh:/boot-test.sh:ro \
          $KVM_DEVICE \
          -e ARCH="${{ inputs.arch }}" \
          -e IMAGE_NAME="${IMAGE_NAME}" \
          ubuntu:26.04 bash /boot-test.sh
